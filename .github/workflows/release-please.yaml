name: Release Please

# Runs on every push to main. Reads conventional commits since the last
# release, then creates or updates a release PR that bumps version.txt and
# CHANGELOG.md. When the release PR is merged, release-please creates the
# GitHub Release and SemVer tag, then this workflow dispatches publish.yaml
# so the image and Helm chart are built and pushed automatically.
#
# No PAT required: workflow_dispatch (used here to trigger publish) works
# with GITHUB_TOKEN + actions:write — only the release: published event is
# blocked by GITHUB_TOKEN. This avoids the need to manage a separate PAT.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

      - name: Trigger publish workflow
        if: ${{ steps.release.outputs.release_created }}
        run: |
          gh workflow run publish.yaml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ steps.release.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
