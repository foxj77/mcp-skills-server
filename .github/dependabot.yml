version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Tracks supergateway in package.json for Dependabot version updates.
  # When Dependabot raises a PR bumping supergateway, also update the matching
  # version in the Dockerfile's `RUN npm install -g` line before merging.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Tracks Python dependencies in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
